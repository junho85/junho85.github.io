version: '3.8'

services:
  jekyll:
    build: .
    ports:
      - "${CMUX_PORT:-4000}:4000"
      - "35729:35729"  # LiveReload port
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    # --future: 예약 발행 글(미래 날짜)도 로컬에서는 미리 보이게 한다.
    # 실제 배포는 GitHub Actions 가 별도로 빌드하므로 영향 없음.
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling --future

volumes:
  bundle: