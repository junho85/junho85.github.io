name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # 예약 발행용. Jekyll 은 future 날짜 글을 빌드에서 빼는데,
  # push 때만 빌드하면 그 날짜가 와도 사이트가 갱신되지 않는다.
  # 매일 한 번 다시 빌드해서 예약된 글이 열리게 한다.
  # cron 은 UTC 기준 — 00:00 UTC = 09:00 KST
  schedule:
    - cron: '0 0 * * *'

  # 웹 UI 의 Run workflow 버튼으로 즉시 빌드
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
